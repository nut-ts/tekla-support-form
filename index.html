<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tekla Support Form</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background-color: #f4f7f6; }
        .form-container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        h2 { text-align: center; color: #00b900; }
        label { font-weight: bold; margin-top: 12px; display: block; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #00b900; color: white; border: none; border-radius: 4px; font-size: 16px; margin-top: 20px; cursor: pointer; font-weight: bold; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #fileSizeInfo { font-size: 13px; margin-top: 5px; line-height: 1.4; }
        .hint-text { font-size: 12px; color: #666; margin-top: 4px; line-height: 1.4; }
        /* สไตล์สำหรับแสดงรายการไฟล์ */
        #fileListDisplay { font-size: 13px; color: #444; margin-top: 8px; padding-left: 20px; margin-bottom: 0; }
        #fileListDisplay li { margin-bottom: 4px; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>ติดต่อ Support</h2>
    <form id="supportForm">
        <label>ชื่อบริษัท (Company)</label>
        <input type="text" id="company" required>

        <label>ชื่อ-นามสกุล ผู้ติดต่อ (Name-Surname)</label>
        <input type="text" id="name" required>

        <label>อีเมลที่ใช้ Tekla Product (Email)</label>
        <input type="email" id="email" required>

        <label>เวอร์ชัน Tekla (Version)</label>
        <select id="version" required>
            <option value="" disabled selected>เลือกเวอร์ชัน...</option>
            <option value="Tekla 2026">Tekla 2026</option>
            <option value="Tekla 2025">Tekla 2025</option>
            <option value="Tekla 2024">Tekla 2024</option>
            <option value="Older">เวอร์ชันเก่ากว่า</option>
        </select>

        <label>รายละเอียดปัญหา (Issue Details)</label>
        <textarea id="issue" rows="4" placeholder="อธิบายรายละเอียดปัญหาที่พบ..." required></textarea>

        <label>แนบไฟล์รูปภาพ / เอกสาร / Zip (รวมกันไม่เกิน 10MB)</label>
        <input type="file" id="fileUpload" accept="image/*, .pdf, .doc, .docx, .zip, .rar" multiple>
        <div id="fileSizeInfo"></div>
        <!-- จุดสำหรับแสดงลำดับชื่อไฟล์ที่เลือก -->
        <ol id="fileListDisplay"></ol>

        <label>หรือ วางลิงก์ไฟล์ (กรณีไฟล์ใหญ่เกิน 10MB)</label>
        <input type="url" id="externalLink" placeholder="วางลิงก์ Google Drive, OneDrive...">
        <div class="hint-text">💡 หากไฟล์เกิน 10MB กรุณาฝากไว้ที่ Google Drive (เปิดสิทธิ์แชร์ลิงก์) แล้วนำลิงก์มาวางในช่องนี้</div>

        <button type="submit" id="submitBtn">ส่งข้อมูล (Submit)</button>
    </form>
</div>

<script>
    const LIFF_ID = "2012561563-OSp0QQl1"; 
    // อย่าลืมตรวจสอบ GAS_URL ว่าเป็นลิงก์ล่าสุดของคุณ
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzpFUCbCQjyK1pmMf0QRqnNkeoduyB0330q4FZyPnMgb1hsuHrufIXfzTmNBnqSzUE-_A/exec";
    
    const MAX_FILE_SIZE = 10485760; // 10MB

    async function initializeLiff() {
        try {
            await liff.init({ liffId: LIFF_ID });
            if (!liff.isLoggedIn()) {
                liff.login();
            }
        } catch (err) {
            console.error("LIFF Init failed", err);
        }
    }
    initializeLiff();

    document.getElementById('fileUpload').addEventListener('change', function() {
        const fileInfo = document.getElementById('fileSizeInfo');
        const fileListDisplay = document.getElementById('fileListDisplay');
        
        // ล้างรายการเก่าออกทุกครั้งที่เลือกไฟล์ใหม่
        fileListDisplay.innerHTML = "";

        if (this.files.length > 0) {
            let totalSize = 0;
            let listHtml = "";

            // วนลูปอ่านชื่อไฟล์และขนาดแต่ละไฟล์
            for (let i = 0; i < this.files.length; i++) {
                let fSizeMB = (this.files[i].size / (1024 * 1024)).toFixed(2);
                totalSize += this.files[i].size;
                listHtml += `<li>${this.files[i].name} <span style="color:#888;">(${fSizeMB} MB)</span></li>`;
            }
            
            const sizeInMB = (totalSize / (1024 * 1024)).toFixed(2); 
            
            // แสดงชื่อไฟล์ทั้งหมดเป็นลำดับข้อ
            fileListDisplay.innerHTML = listHtml;

            if (totalSize > MAX_FILE_SIZE) {
                fileInfo.innerHTML = `❌ ขนาดรวม: <b>${sizeInMB} MB</b> (เกิน 10MB)<br>💡 กรุณานำไฟล์ฝากไว้ที่ <b>Google Drive</b> แล้วนำลิงก์มาวางในช่องด้านล่างแทนครับ`;
                fileInfo.style.color = "red";
            } else {
                fileInfo.innerHTML = `✅ เลือก ${this.files.length} ไฟล์ | ขนาดรวม: <b>${sizeInMB} MB</b> (พร้อมส่ง)`;
                fileInfo.style.color = "#00b900";
            }
        } else {
            fileInfo.innerHTML = "";
        }
    });

    function getBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
        });
    }

    document.getElementById('supportForm').addEventListener('submit', async function(e) {
        e.preventDefault(); 

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = "กำลังส่งข้อมูล... (อาจใช้เวลาสักครู่)";

        try {
            const fileInput = document.getElementById('fileUpload').files;
            let filesArray = [];

            if (fileInput.length > 0) {
                let totalSize = 0;
                for (let i = 0; i < fileInput.length; i++) {
                    totalSize += fileInput[i].size;
                }

                if (totalSize > MAX_FILE_SIZE) {
                    const sizeMB = (totalSize / (1024 * 1024)).toFixed(2);
                    alert(`ไฟล์ทั้งหมดมีขนาดรวม ${sizeMB} MB ซึ่งเกิน 10MB\n\nกรุณานำไฟล์ฝากไว้ที่ Google Drive (เปิดสิทธิ์แชร์ลิงก์) แล้วนำลิงก์มาวางในช่องด้านล่างแทนครับ`);
                    submitBtn.disabled = false;
                    submitBtn.innerText = "ส่งข้อมูล (Submit)";
                    return;
                }

                for (let i = 0; i < fileInput.length; i++) {
                    const base64 = await getBase64(fileInput[i]);
                    filesArray.push({
                        fileName: fileInput[i].name,
                        fileMimeType: fileInput[i].type || "application/octet-stream",
                        fileBase64: base64
                    });
                }
            }

            const payload = {
                company: document.getElementById('company').value,
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                version: document.getElementById('version').value,
                issue: document.getElementById('issue').value,
                externalLink: document.getElementById('externalLink').value.trim(),
                files: filesArray 
            };

            const response = await fetch(GAS_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (result.status === "success") {
                alert("ส่งข้อมูลสำเร็จ! ทางทีม Support จะตรวจสอบและตอบกลับทางอีเมลที่ท่านให้ไว้โดยเร็วที่สุด");
                liff.closeWindow(); 
            } else {
                alert("เกิดข้อผิดพลาด: " + result.message);
                submitBtn.disabled = false;
                submitBtn.innerText = "ส่งข้อมูล (Submit)";
            }

        } catch (error) {
            console.error(error);
            alert("ระบบล้มเหลว: " + error.message);
            submitBtn.disabled = false;
            submitBtn.innerText = "ส่งข้อมูล (Submit)";
        }
    });
</script>

</body>
</html>
