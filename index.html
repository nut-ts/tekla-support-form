<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tekla Support Form</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background-color: #f4f7f6; }
        .form-container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        h2 { text-align: center; color: #00b900; }
        label { font-weight: bold; margin-top: 10px; display: block; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #00b900; color: white; border: none; border-radius: 4px; font-size: 16px; margin-top: 20px; cursor: pointer; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #fileSizeInfo { font-size: 13px; margin-top: 5px; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>ติดต่อ Support</h2>
    <form id="supportForm">
        <label>ชื่อบริษัท (Company)</label>
        <input type="text" id="company" required>

        <label>ชื่อ-นามสกุล ผู้ติดต่อ (Name-Surname)</label>
        <input type="text" id="name" required>

        <label>อีเมลที่ใช้ Tekla Product (Email)</label>
        <input type="email" id="email" required>

        <label>เวอร์ชัน Tekla (Version)</label>
        <select id="version" required>
            <option value="" disabled selected>เลือกเวอร์ชัน...</option>
            <option value="Tekla 2026">Tekla 2026</option>
            <option value="Tekla 2025">Tekla 2025</option>
            <option value="Tekla 2024">Tekla 2024</option>
            <option value="Older">เวอร์ชันเก่ากว่า</option>
        </select>

        <label>รายละเอียดปัญหา (Issue Details)</label>
        <textarea id="issue" rows="4" required></textarea>

        <label>แนบไฟล์รูปภาพ / เอกสาร / Zip (ไม่เกิน 25MB)</label>
        <input type="file" id="fileUpload" accept="image/*, .pdf, .doc, .docx, .zip, .rar">
        <div id="fileSizeInfo"></div>

        <button type="submit" id="submitBtn">ส่งข้อมูล (Submit)</button>
    </form>
</div>

<script>
    // ----------------------------------------------------------------
    // ใช้ค่าเดิมที่คุณให้มาในตอนแรก
    const LIFF_ID = "2012561563-OSp0QQl1"; 
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyfR3AnDkOudEhDvCVDwPSGQu1cRnzEvj4TORGyIxCVkBK4Qh3GZyIflS_zaQ1E183IJg/exec";
    // ----------------------------------------------------------------
    
    const MAX_FILE_SIZE = 26214400; // 25MB (25 * 1024 * 1024 bytes)

    // 1. เริ่มต้น LIFF
    async function initializeLiff() {
        try {
            await liff.init({ liffId: LIFF_ID });
            if (!liff.isLoggedIn()) {
                liff.login();
            }
        } catch (err) {
            console.error("LIFF Init failed", err);
        }
    }
    initializeLiff();

    // 2. แสดงขนาดไฟล์เมื่อเลือกไฟล์
    document.getElementById('fileUpload').addEventListener('change', function() {
        const fileInfo = document.getElementById('fileSizeInfo');
        if (this.files.length > 0) {
            const fileSize = this.files[0].size;
            const sizeInMB = (fileSize / (1024 * 1024)).toFixed(2); 
            
            if (fileSize > MAX_FILE_SIZE) {
                fileInfo.innerHTML = `❌ ขนาดไฟล์: <b>${sizeInMB} MB</b> (เกิน 25MB ที่กำหนด)`;
                fileInfo.style.color = "red";
            } else {
                fileInfo.innerHTML = `✅ ขนาดไฟล์: <b>${sizeInMB} MB</b>`;
                fileInfo.style.color = "#00b900";
            }
        } else {
            fileInfo.innerHTML = "";
        }
    });

    // 3. จัดการเมื่อกดปุ่ม Submit (ใช้ FormData แทน Base64)
    document.getElementById('supportForm').addEventListener('submit', async function(e) {
        e.preventDefault(); 

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = "กำลังส่งข้อมูล... (อาจใช้เวลาสักครู่)";

        try {
            const fileInput = document.getElementById('fileUpload').files[0];

            // ตรวจสอบขนาดไฟล์ก่อนส่ง
            if (fileInput && fileInput.size > MAX_FILE_SIZE) {
                const sizeMB = (fileInput.size / (1024 * 1024)).toFixed(2);
                alert(`ขนาดไฟล์ ${sizeMB} MB ใหญ่เกินไป กรุณาแนบไฟล์ไม่เกิน 25MB`);
                submitBtn.disabled = false;
                submitBtn.innerText = "ส่งข้อมูล (Submit)";
                return;
            }

            // ใช้ FormData เพื่อส่งไฟล์ดิบๆ (Binary) ข้ามไปให้ Google Apps Script
            const formData = new FormData();
            formData.append("company", document.getElementById('company').value);
            formData.append("name", document.getElementById('name').value);
            formData.append("email", document.getElementById('email').value);
            formData.append("version", document.getElementById('version').value);
            formData.append("issue", document.getElementById('issue').value);
            
            if (fileInput) {
                formData.append("file", fileInput); 
            }

            // ส่งข้อมูล
            const response = await fetch(GAS_URL, {
                method: "POST",
                body: formData // ส่ง formData ตรงๆ ไม่ต้องแปลง JSON
            });

            const result = await response.json();

            if (result.status === "success") {
                alert("ส่งข้อมูลสำเร็จ! เจ้าหน้าที่จะติดต่อกลับโดยเร็วที่สุด");
                liff.closeWindow(); 
            } else {
                alert("เกิดข้อผิดพลาด: " + result.message);
                submitBtn.disabled = false;
                submitBtn.innerText = "ส่งข้อมูล (Submit)";
            }

        } catch (error) {
            console.error(error);
            // แจ้งเตือน Error
            alert("ระบบล้มเหลว (System Error): " + error.message + "\n\n(หากขึ้นคำว่า 'Failed to fetch' หรือ 'Unexpected token <' แสดงว่าตั้งค่า Deploy หรือ URL ผิดครับ)");
            submitBtn.disabled = false;
            submitBtn.innerText = "ส่งข้อมูล (Submit)";
        }
    });
</script>

</body>
</html>
